name: Build and release Windows

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install desktop dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = python -c "from mcmonitor import __version__; print(__version__)"
          if ($env:TAG_NAME -ne "v$version") {
            throw "Release tag must be v$version to match mcmonitor.__version__"
          }

      - name: Embed update repository
        shell: pwsh
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          $manifest = Get-Content version.json -Raw | ConvertFrom-Json
          $manifest.repository = $env:GH_REPOSITORY
          $manifest.version = python -c "from mcmonitor import __version__; print(__version__)"
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 version.json

      - name: Build Windows executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name MC-Monitor --icon assets/icon.ico
          --add-data "assets;assets" --add-data "version.json;."
          mcmonitor/__main__.py

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "Inno Setup compiler was not found."
          }
          $version = python -c "from mcmonitor import __version__; print(__version__)"
          & $compiler "/DAppVersion=$version" "installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: MC-Monitor-Windows
          path: |
            dist/MC-Monitor.exe
            dist/MC-Monitor-Setup-*.exe
          if-no-files-found: error

      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/MC-Monitor.exe
            dist/MC-Monitor-Setup-*.exe
          generate_release_notes: true
